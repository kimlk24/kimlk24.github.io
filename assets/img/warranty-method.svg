<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="300" fill="#ffffff"/>

  <text x="520" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#2b2b2b">How the warranty rate was computed</text>

  <g font-size="16" fill="#2b2b2b">
    <!-- 1 -->
    <rect x="20" y="90" width="176" height="110" rx="8" fill="#f4f4f4" stroke="#d6d6d6"/>
    <text x="108" y="128" text-anchor="middle" font-weight="600">Warranty log</text>
    <text x="108" y="150" text-anchor="middle" font-size="13" fill="#6b6b6b">988 rows,</text>
    <text x="108" y="168" text-anchor="middle" font-size="13" fill="#6b6b6b">free-text faults</text>

    <line x1="200" y1="145" x2="240" y2="145" stroke="#9a9a9a" stroke-width="2"/>
    <polygon points="240,145 230,139 230,151" fill="#9a9a9a"/>

    <!-- 2 -->
    <rect x="244" y="90" width="176" height="110" rx="8" fill="#f4f4f4" stroke="#d6d6d6"/>
    <text x="332" y="128" text-anchor="middle" font-weight="600">Classify by fix</text>
    <text x="332" y="150" text-anchor="middle" font-size="13" fill="#6b6b6b">technician's repair,</text>
    <text x="332" y="168" text-anchor="middle" font-size="13" fill="#6b6b6b">not customer symptom</text>

    <line x1="424" y1="145" x2="464" y2="145" stroke="#9a9a9a" stroke-width="2"/>
    <polygon points="464,145 454,139 454,151" fill="#9a9a9a"/>

    <!-- 3 -->
    <rect x="468" y="90" width="176" height="110" rx="8" fill="#f4f4f4" stroke="#d6d6d6"/>
    <text x="556" y="128" text-anchor="middle" font-weight="600">Join to shipments</text>
    <text x="556" y="150" text-anchor="middle" font-size="13" fill="#6b6b6b">rate per unit shipped,</text>
    <text x="556" y="168" text-anchor="middle" font-size="13" fill="#6b6b6b">not a raw count</text>

    <line x1="648" y1="145" x2="688" y2="145" stroke="#9a9a9a" stroke-width="2"/>
    <polygon points="688,145 678,139 678,151" fill="#9a9a9a"/>

    <!-- 4 -->
    <rect x="692" y="90" width="176" height="110" rx="8" fill="#f4f4f4" stroke="#d6d6d6"/>
    <text x="780" y="128" text-anchor="middle" font-weight="600">Drop bad months</text>
    <text x="780" y="150" text-anchor="middle" font-size="13" fill="#6b6b6b">excluded, not treated</text>
    <text x="780" y="168" text-anchor="middle" font-size="13" fill="#6b6b6b">as zero-defect</text>

    <line x1="872" y1="145" x2="912" y2="145" stroke="#9a9a9a" stroke-width="2"/>
    <polygon points="912,145 902,139 902,151" fill="#9a9a9a"/>

    <!-- 5 -->
    <rect x="916" y="90" width="104" height="110" rx="8" fill="#f4f4f4" stroke="#d6d6d6"/>
    <text x="968" y="128" text-anchor="middle" font-weight="600" font-size="14">Check</text>
    <text x="968" y="146" text-anchor="middle" font-weight="600" font-size="14">the lag</text>
    <text x="968" y="168" text-anchor="middle" font-size="11" fill="#6b6b6b">vs. shipments</text>
    <text x="968" y="182" text-anchor="middle" font-size="11" fill="#6b6b6b">+3 / +6 mo</text>
  </g>

  <text x="520" y="240" text-anchor="middle" font-size="13" fill="#8a8a8a">Same method applied to every window compared in the results below.</text>
</svg>
